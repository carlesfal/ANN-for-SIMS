version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ann-sims-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/models:/app/models
      - ./backend/results:/app/results
    environment:
      - NODE_ENV=production
      - PORT=5000
      - FRONTEND_URL=http://localhost:3000
    restart: unless-stopped
    networks:
      - ann-sims-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ann-sims-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
    restart: unless-stopped
    networks:
      - ann-sims-network

  nginx:
    image: nginx:alpine
    container_name: ann-sims-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - ann-sims-network

networks:
  ann-sims-network:
    driver: bridge

volumes:
  uploads_data:
  models_data:
  results_data:
